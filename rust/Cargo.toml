# ============================================================================
# ⚠️ 编译前必读：Slint 依赖用的是 **本机路径**，换机器无法直接编译
# ============================================================================
# 下面 `slint` / `slint-build` 是 path 依赖，指向本仓库开发机 D 盘的 Slint 源码
# 检出（含已编译产物），目的是复用本机依赖缓存，避免重新下载上千个 crate。
#
#   → **仅本机可编译**。其他人拿到本仓库直接 `cargo build` 会失败
#     （找不到 D:/slint-ui/slint）。
#
#   → **想要编译此程序，请把 Cargo.toml 里这两行改成版本号**：
#
#         [dependencies]
#         slint = { version = "1.16", optional = true, default-features = false,
#                   features = ["std", "backend-default", "renderer-femtovg",
#                               "compat-1-2"] }
#
#         [build-dependencies]
#         slint-build = { version = "1.16", optional = true }
#
#     改完后首次编译需要联网下载依赖（约 16 分钟）。
#
# 不需要界面时（只用 CLI）不受影响：`cargo build --release` 不启用 slint-ui
# 特性，不会解析 Slint，无需改动任何依赖。
# ============================================================================

[package]
name = "adb_bridge_rs"
version = "1.0.0"
edition = "2021"
description = "ADB TCP 桥 —— Rust 版（把仅支持 USB 的 adb 设备暴露为标准 TCP adb 设备）"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["adb", "android", "bridge", "tcp", "usb"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "adb_bridge_rs"
path = "src/main.rs"

# 图形界面入口（windows 子系统，双击不弹控制台黑窗）
[[bin]]
name = "adb_bridge_slint"
path = "src/bin/slint.rs"
required-features = ["slint-ui"]

[dependencies]
# ---- 图形界面（可选）----
#
# Slint：声明式保留模式，视觉表现力更强。
#
# ⚠️ 这里用 **path 依赖**指向本机已有的 Slint 源码检出（D 盘，含 2.6GB 已编译产物），
# 目的是复用本机已有的依赖缓存，避免重复下载上千个 crate。
# **发布到其他机器、或 D 盘目录移动后，把这两行改成版本号即可**：
#     slint = "1.16"
#     slint-build = "1.16"
# 关掉默认特性里的 accessibility：它会引入 accesskit 及一整批
# Linux 无障碍依赖（accesskit_atspi_* 等），Windows 上根本用不到，
# 却必须下载才能完成依赖解析。桌面工具无需无障碍，关掉可显著减小依赖树。
slint = {
    path = "D:/slint-ui/slint/api/rs/slint",
    optional = true,
    default-features = false,
    features = ["std", "backend-default", "renderer-femtovg", "compat-1-2"],
}

[build-dependencies]
slint-build = { path = "D:/slint-ui/slint/api/rs/build", optional = true }

[features]
default = []
# 图形界面（Slint）。不启用时只构建命令行版，不解析任何界面依赖。
slint-ui = ["dep:slint", "dep:slint-build"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
